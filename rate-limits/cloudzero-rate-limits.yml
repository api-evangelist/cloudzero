specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: CloudZero
providerId: cloudzero
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - Cloud Cost Management
  - Rate Limiting
notes: CloudZero does not publish public rate-limit numbers for its REST API. Limits are enforced at the
  account level and are documented in the product's authenticated developer portal. Treat the entry below
  as an umbrella reference.
description: CloudZero's REST API enforces per-account throttling and a fair-use ceiling. Specific TPS
  / RPM numbers are not published on the public pricing or developer-marketing pages; they are documented
  inside the authenticated console.
sources:
  - https://www.cloudzero.com/
  - https://docs.cloudzero.com/
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Account-level throttling
    scope: account
    metric: varies
    limit: see CloudZero developer docs (authenticated)
    notes: Specific per-second / per-minute numbers are not published publicly. Authenticated users can
      view live limits in the in-app docs.
policies:
  - name: Backoff strategy
    description: On HTTP 429 responses honor any Retry-After header and back off with jitter before retrying.
  - name: Fair use
    description: Even on enterprise plans, sustained bursty usage that materially impacts shared infrastructure
      may be subject to fair-use throttling.
  - name: Authenticated documentation
    description: Live, account-specific rate limits are surfaced inside the CloudZero console; consult
      the in-product developer documentation for current values.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
