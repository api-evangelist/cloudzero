naftiko: 1.0.0-alpha2
info:
  label: CloudZero API — Budgets
  description: 'CloudZero API — Budgets. 5 operations. Lead operation: CloudZero Get all budgets. Self-contained Naftiko capability
    covering one Cloudzero business surface.'
  tags:
  - Cloudzero
  - Budgets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CLOUDZERO_API_KEY: CLOUDZERO_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloudzero-budgets
    baseUri: https://api.cloudzero.com
    description: CloudZero API — Budgets business capability. Self-contained, no shared references.
    resources:
    - name: v2-budgets
      path: /v2/budgets
      operations:
      - name: getbudgets
        method: GET
        description: CloudZero Get all budgets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Page number for pagination.
        - name: page_size
          in: query
          type: integer
          description: Number of results per page.
      - name: createbudget
        method: POST
        description: CloudZero Create a new budget
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v2-budgets-budget_id
      path: /v2/budgets/{budget_id}
      operations:
      - name: getonebudget
        method: GET
        description: CloudZero Get a single budget
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: budget_id
          in: path
          type: string
          description: Unique identifier for the budget.
          required: true
      - name: updateonebudget
        method: PUT
        description: CloudZero Update a budget
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: budget_id
          in: path
          type: string
          description: Unique identifier for the budget.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteonebudget
        method: DELETE
        description: CloudZero Delete a budget
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: budget_id
          in: path
          type: string
          description: Unique identifier for the budget.
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.CLOUDZERO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: cloudzero-budgets-rest
    port: 8080
    description: REST adapter for CloudZero API — Budgets. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v2/budgets
      name: v2-budgets
      description: REST surface for v2-budgets.
      operations:
      - method: GET
        name: getbudgets
        description: CloudZero Get all budgets
        call: cloudzero-budgets.getbudgets
        with:
          page: rest.page
          page_size: rest.page_size
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createbudget
        description: CloudZero Create a new budget
        call: cloudzero-budgets.createbudget
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/budgets/{budget-id}
      name: v2-budgets-budget-id
      description: REST surface for v2-budgets-budget_id.
      operations:
      - method: GET
        name: getonebudget
        description: CloudZero Get a single budget
        call: cloudzero-budgets.getonebudget
        with:
          budget_id: rest.budget_id
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateonebudget
        description: CloudZero Update a budget
        call: cloudzero-budgets.updateonebudget
        with:
          budget_id: rest.budget_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteonebudget
        description: CloudZero Delete a budget
        call: cloudzero-budgets.deleteonebudget
        with:
          budget_id: rest.budget_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cloudzero-budgets-mcp
    port: 9090
    transport: http
    description: MCP adapter for CloudZero API — Budgets. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: cloudzero-get-all-budgets
      description: CloudZero Get all budgets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloudzero-budgets.getbudgets
      with:
        page: tools.page
        page_size: tools.page_size
      outputParameters:
      - type: object
        mapping: $.
    - name: cloudzero-create-new-budget
      description: CloudZero Create a new budget
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cloudzero-budgets.createbudget
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cloudzero-get-single-budget
      description: CloudZero Get a single budget
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloudzero-budgets.getonebudget
      with:
        budget_id: tools.budget_id
      outputParameters:
      - type: object
        mapping: $.
    - name: cloudzero-update-budget
      description: CloudZero Update a budget
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: cloudzero-budgets.updateonebudget
      with:
        budget_id: tools.budget_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cloudzero-delete-budget
      description: CloudZero Delete a budget
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: cloudzero-budgets.deleteonebudget
      with:
        budget_id: tools.budget_id
      outputParameters:
      - type: object
        mapping: $.
