# Naftiko capabilities profile for CloudZero.
# Capabilities map FinOps verbs against the CloudZero V2 REST API: billing
# queries, insights, budgets, allocation telemetry, unit metric telemetry,
# and AnyCost ingestion.
provider: cloudzero
name: CloudZero
description: >-
  Capabilities cover querying billing costs and dimensions, managing
  insights and budgets, sending allocation and unit metric telemetry,
  and ingesting cost data from any source via the AnyCost framework.
capabilities:
  - id: cloudzero.billing.costs
    name: Query billing costs
    description: Return cost rows for a date range with selected dimensions and metrics.
    api: cloudzero:billing
    inputs:
      - start_date
      - end_date
      - dimensions
      - metrics
      - filter
      - page
      - page_size
    outputs:
      - results
      - total

  - id: cloudzero.billing.dimensions
    name: List billing dimensions
    description: Return the set of dimensions available for billing queries.
    api: cloudzero:billing
    outputs:
      - dimensions

  - id: cloudzero.insights.list
    name: List insights
    description: Return cost insights and recommendations.
    api: cloudzero:insights
    inputs:
      - page
      - page_size
      - status
      - severity
    outputs:
      - items
      - total

  - id: cloudzero.insights.create
    name: Create insight
    description: Record a new actionable cost insight.
    api: cloudzero:insights
    inputs:
      - title
      - description
      - severity
      - estimated_savings
      - assigned_to
    outputs:
      - insight_id
      - status

  - id: cloudzero.insights.update
    name: Update insight
    description: Update status, owner, or savings estimate of an existing insight.
    api: cloudzero:insights
    inputs:
      - insight_id
      - status
      - assigned_to
      - notes
    outputs:
      - status

  - id: cloudzero.insights.delete
    name: Delete insight
    description: Remove an insight from the platform.
    api: cloudzero:insights
    inputs:
      - insight_id
    outputs:
      - status

  - id: cloudzero.budgets.list
    name: List budgets
    description: Return configured spend budgets and current consumption.
    api: cloudzero:budgets
    inputs:
      - page
      - page_size
    outputs:
      - items
      - total

  - id: cloudzero.budgets.create
    name: Create budget
    description: Create a new cost-and-usage budget with thresholds and alerts.
    api: cloudzero:budgets
    inputs:
      - name
      - amount
      - currency
      - period
      - thresholds
      - filter
    outputs:
      - budget_id
      - status

  - id: cloudzero.budgets.update
    name: Update budget
    description: Update amount, thresholds, or alert routing on an existing budget.
    api: cloudzero:budgets
    inputs:
      - budget_id
      - amount
      - thresholds
    outputs:
      - status

  - id: cloudzero.budgets.delete
    name: Delete budget
    description: Remove a budget definition.
    api: cloudzero:budgets
    inputs:
      - budget_id
    outputs:
      - status

  - id: cloudzero.allocation-telemetry.sum
    name: Send allocation telemetry (sum)
    description: Submit allocation values that are summed into the named stream.
    api: cloudzero:allocation-telemetry
    inputs:
      - stream_name
      - records
    outputs:
      - accepted
      - rejected

  - id: cloudzero.allocation-telemetry.replace
    name: Replace allocation telemetry
    description: Replace allocation values for a date range in the named stream.
    api: cloudzero:allocation-telemetry
    inputs:
      - stream_name
      - records
      - start_date
      - end_date
    outputs:
      - status

  - id: cloudzero.allocation-telemetry.delete
    name: Delete allocation telemetry
    description: Delete allocation telemetry for a stream and date range.
    api: cloudzero:allocation-telemetry
    inputs:
      - stream_name
      - start_date
      - end_date
    outputs:
      - status

  - id: cloudzero.unit-metric-telemetry.send
    name: Send unit metric telemetry
    description: Submit unit-metric records (cost-per-customer, cost-per-transaction).
    api: cloudzero:unit-metric-telemetry
    inputs:
      - stream_name
      - records
    outputs:
      - accepted
      - rejected

  - id: cloudzero.unit-metric-telemetry.delete
    name: Delete unit metric telemetry
    description: Delete unit-metric records for a stream.
    api: cloudzero:unit-metric-telemetry
    inputs:
      - stream_name
      - start_date
      - end_date
    outputs:
      - status

  - id: cloudzero.anycost.ingest
    name: Ingest AnyCost billing drop
    description: Upload a Common Bill Format (CBF) billing drop for a connection.
    api: cloudzero:anycost
    inputs:
      - connection_id
      - month
      - billing_drop
    outputs:
      - drop_id
      - status

  - id: cloudzero.anycost.list-drops
    name: List AnyCost billing drops
    description: List historical billing drops for a connection.
    api: cloudzero:anycost
    inputs:
      - connection_id
    outputs:
      - items
