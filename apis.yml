description: >-
  CloudZero is a cloud cost intelligence and FinOps platform that automates the collection, allocation, and analysis of
  infrastructure spend to uncover waste and improve unit economics. The CloudZero API V2 is REST-oriented, uses API key
  authentication, and exposes endpoints for querying billing costs and dimensions, managing insights and budgets,
  sending unit metric and allocation telemetry, and ingesting cost data from any source via the AnyCost framework.
apis:
- aid: cloudzero:billing
  name: CloudZero Billing API
  description: >-
    The Billing API exposes cost and dimension data for analysis. Endpoints under /v2/billing return cost
    rows over a date range with selectable dimensions (account, service, region, custom dimension) and
    metrics (real_cost, billed_cost). Pagination uses page and page_size query parameters.
  humanURL: https://docs.cloudzero.com/reference/billing
  baseURL: https://api.cloudzero.com/v2/billing
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Billing
  - Cost Reporting
  - Dimensions
  properties:
  - type: Documentation
    url: https://docs.cloudzero.com/reference/billing
- aid: cloudzero:insights
  name: CloudZero Insights API
  description: >-
    The Insights API stores and surfaces actionable cost insights and recommendations. Endpoints under
    /v2/insights support listing, creating, updating, and deleting insight records, including assigned
    owners, severity, status, and estimated savings.
  humanURL: https://docs.cloudzero.com/reference/insights
  baseURL: https://api.cloudzero.com/v2/insights
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Cost Optimization
  - Insights
  - Recommendations
  properties:
  - type: Documentation
    url: https://docs.cloudzero.com/reference/insights
- aid: cloudzero:budgets
  name: CloudZero Budgets API
  description: >-
    The Budgets API manages cost-and-usage budgets, alerts, thresholds, and actuals tracking. Endpoints
    under /v2/budgets list, create, update, and delete budgets and surface current consumption against
    limits.
  humanURL: https://docs.cloudzero.com/reference/budgets
  baseURL: https://api.cloudzero.com/v2/budgets
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Alerts
  - Budgets
  - FinOps
  properties:
  - type: Documentation
    url: https://docs.cloudzero.com/reference/budgets
- aid: cloudzero:allocation-telemetry
  name: CloudZero Allocation Telemetry API
  description: >-
    Allocation Telemetry sends, edits, and deletes allocation telemetry data for splitting cloud cost
    across custom allocation dimensions. Endpoints under /v1/telemetry/allocation/{stream_name} support
    sum, replace, and delete operations against a named telemetry stream.
  humanURL: https://docs.cloudzero.com/reference/allocation-telemetry
  baseURL: https://api.cloudzero.com/v1/telemetry/allocation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Allocations
  - Cost Splitting
  - Telemetry
  tags_raw:
  - Allocation
  - Cost Splitting
  - Telemetry
  properties:
  - type: Documentation
    url: https://docs.cloudzero.com/reference/allocation-telemetry
- aid: cloudzero:unit-metric-telemetry
  name: CloudZero Unit Metric Telemetry API
  description: >-
    Unit Metric Telemetry ingests business metrics that drive unit-economics calculations (cost per customer,
    cost per transaction, cost per tenant). Endpoints under /v1/telemetry/{stream_name} support submitting
    records, deleting, and replacing values for named streams.
  humanURL: https://docs.cloudzero.com/reference/unit-metric-telemetry
  baseURL: https://api.cloudzero.com/v1/telemetry
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Telemetry
  - Unit Economics
  - Unit Metrics
  properties:
  - type: Documentation
    url: https://docs.cloudzero.com/reference/unit-metric-telemetry
- aid: cloudzero:anycost
  name: CloudZero AnyCost API
  description: >-
    AnyCost ingests cost data from any source using the AnyCost Stream Adaptor and Common Bill Format
    (CBF). Endpoints under /v2/connections/billing/anycost/{connection_id}/billing_drops accept uploads
    of normalized billing drops alongside native AWS, Azure, and GCP integrations.
  humanURL: https://docs.cloudzero.com/reference/anycost
  baseURL: https://api.cloudzero.com/v2/connections/billing/anycost
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - AnyCost
  - Billing Drop
  - CBF
  - Common Bill Format
  - Ingestion
  properties:
  - type: Documentation
    url: https://docs.cloudzero.com/reference/anycost
