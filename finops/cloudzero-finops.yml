specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: CloudZero
providerId: cloudzero
publisherName: CloudZero, Inc.
serviceCategory: FinOps Platform
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Cloud Cost Management
  - Cost Allocation
  - Unit Economics
notes: CloudZero is itself a FinOps platform, so this artifact describes the cost surface of consuming
  the CloudZero product. Public pricing numbers are not disclosed (contact-sales), so the focus columns
  and meters reflect the structural shape of a CloudZero subscription invoice rather than verified line-items.
description: 'FOCUS-aligned FinOps for the CloudZero platform itself: a contact-sales subscription that
  scales with ingested cloud spend, with unlimited user seats. CloudZero is a FOCUS member organization
  and exports cost data in FOCUS format to its customers.'
sources:
  - https://www.cloudzero.com/pricing/
  - https://www.cloudzero.com/focus/
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
    - Adjustment
focusColumns:
  ServiceName: CloudZero
  ServiceCategory: FinOps Platform
  ProviderName: CloudZero
  PublisherName: CloudZero, Inc.
  InvoiceIssuerName: CloudZero, Inc.
  PricingCategory: Subscription
  PricingUnit: subscription-month
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: subscription_fee
    description: Recurring CloudZero platform subscription fee.
    unit: month
    aggregation: sum
    dimensions:
      - plan
  - name: cloud_spend_ingested
    description: Cloud spend (USD) ingested into the CloudZero platform across connected accounts.
    unit: usd
    aggregation: sum
    dimensions:
      - cloud_provider
      - account
  - name: user_seats
    description: Active user seats (CloudZero markets unlimited seats; may still appear on invoice).
    unit: seat-month
    aggregation: max
    dimensions:
      - role
  - name: data_sources
    description: Connected data sources (AWS, Azure, GCP, Snowflake, Kubernetes, SaaS).
    unit: source
    aggregation: max
    dimensions:
      - source_type
principles:
  - name: Visibility
    description: Use CloudZero's own dashboards and the FOCUS export to see what you spend on CloudZero
      itself, not just the cloud spend it ingests.
  - name: Allocation
    description: Tag the CloudZero subscription line in your AP system to the FinOps practice or the team
      that owns FinOps tooling; flow the FOCUS-format export back into your data warehouse alongside CUR.
  - name: Optimization
    description: Right-size the contract against the cloud spend you actually ingest into CloudZero; consolidate
      data sources rather than activating them speculatively, since pricing scales with ingested spend.
  - name: Accountability
    description: Assign FinOps platform ownership to a single accountable owner who reviews monthly utilization
      against the contract during the CloudZero-led FinOps Account Manager check-in.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
