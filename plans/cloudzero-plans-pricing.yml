specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: CloudZero
providerId: cloudzero
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - Cloud Cost Management
  - Cost Allocation
  - Unit Economics
  - Telemetry
notes: CloudZero does not publish dollar-figure pricing on its public pricing page. The vendor describes
  its model as a steady, predictable tiered subscription with unlimited users; concrete pricing is gated
  behind a contact form. The single contact-sales plan below preserves the API Commons Plans structure
  without fabricating numbers.
description: CloudZero is a cloud cost intelligence (FinOps) SaaS platform priced as a contact-sales tiered
  subscription that scales with cloud spend ingested. Public pricing page does not list dollar values; pricing
  is requested via form. Customer count of users is unlimited within a plan.
sources:
  - https://www.cloudzero.com/pricing/
plans:
  - id: cloudzero-platform
    name: CloudZero Platform
    type: subscription
    description: Contact-sales tiered subscription. CloudZero markets a single platform offering with monthly
      pricing that scales with cloud spend ingested and product modules enabled. Unlimited user seats.
    entries:
      - label: Platform Subscription
        name: platform_subscription
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
      - label: Cloud Spend Ingested
        name: cloud_spend_ingested
        type: metered
        metric: usd
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see https://www.cloudzero.com/pricing/
        userMultiplied: false
      - label: User Seats
        name: user_seats
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: included (unlimited)
        userMultiplied: false
    elements:
      - name: Cloud cost ingestion (AWS, Azure, GCP, Snowflake, Kubernetes, SaaS)
      - name: Custom dashboards and reports
      - name: Cost allocation (CostFormation)
      - name: Anomaly detection
      - name: Unit economics
      - name: Budgets and forecasting
      - name: Monthly FinOps Account Manager check-ins
      - name: Unlimited users
maintainers:
